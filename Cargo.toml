[workspace]
resolver = "2"
members = [
    "crates/auge_interfaces",
    "apps/telegram-operaciones-bot",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
convex = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
